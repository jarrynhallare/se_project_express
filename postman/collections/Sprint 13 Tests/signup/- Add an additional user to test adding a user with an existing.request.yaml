$kind: http-request
name: "* Add an additional user to test adding a user with an existing email to the database"
url: "{{base_url}}/signup"
method: POST
body:
  type: json
  content: "{\r

    \    \"email\": \"{{user_email_third}}\",\r

    \    \"password\": \"{{user_password}}\",\r

    \    \"name\": \"{{user_name}}\",\r

    \    \"avatar\": \"{{user_avatar}}\"\r

    }"
auth:
  type: noauth
order: 7000
