$kind: http-request
name: '[-] [POST] Add a user with "name" field less than 2 characters'
url: "{{base_url}}/signup"
method: POST
body:
  type: json
  content: "{\r

    \    \"email\": \"{{$randomEmail}}\",\r

    \    \"password\": \"{{user_password}}\",\r

    \    \"name\": \"{{$randomAlphaNumeric}}\",\r

    \    \"avatar\": \"{{user_avatar}}\"\r

    }"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code should be 400\", () => {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Response body should have json with a 'message' property\", () => {\r

      \    pm.response.to.have.jsonSchema(JSON.parse(pm.collectionVariables.get(\"schema_message_only\")))\r

      });"
    language: text/javascript
order: 1000
