$kind: http-request
url: "{{base_url}}/items/:id"
method: DELETE
pathVariables:
  id: "{{item_id}}"
auth:
  type: bearer
  credentials:
    token: "{{jwt_token_2}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code should be 403\", function () {\r

      \    pm.response.to.have.status(403);\r

      });"
    language: text/javascript
  - type: beforeRequest
    code: |
      const createItemOpts = {
        url: `${pm.collectionVariables.get('base_url')}/items`,
        method: "POST",
        header: {
          "Content-Type": "application/json",
      		"Authorization": `Bearer ${pm.collectionVariables.get('jwt_token')}`
        },
        body: JSON.stringify({
          name: `${pm.collectionVariables.get('item_name')}`,
      		weather: `${pm.collectionVariables.get('item_weather')}`,
      		imageUrl: `${pm.collectionVariables.get('item_imageUrl')}`,
        })
      }


      const signUpOpts = {
      	method: 'POST',
      	url: `${pm.collectionVariables.get('base_url')}/signup`,
      	header: { "Content-Type": "application/json" },
      	body: JSON.stringify({
      		email: `${pm.collectionVariables.get('user_email_third')}`,
      		password: `${pm.collectionVariables.get('user_password')}`,
      		avatar: pm.variables.replaceIn("{{$randomAvatarImage}}"),
      		name: pm.variables.replaceIn("{{$randomFullName}}"),
      	})
      }


      const signInOpts = {
      	method: 'POST',
      	url: `${pm.collectionVariables.get('base_url')}/signin`,
      	header: { "Content-Type": "application/json" },
      	body: JSON.stringify({
      		email: `${pm.collectionVariables.get('user_email_third')}`,
      		password: `${pm.collectionVariables.get('user_password')}`,
      	})
      }

      // 1. Create an Item
      pm.sendRequest(createItemOpts, (error, response) => {
      	if (response.json()) {
      		const item = utils.getData(response.json());
      		pm.collectionVariables.set('item_id', item._id);

      		// 2. Sign up the 2nd User if not exist already
      		pm.sendRequest(signUpOpts, (error, response) => {
      			// 3. Signin the other User
      			pm.sendRequest(signInOpts, (error, response) => {
      				if (response) {
      					const data = utils.getData(response.json());
      					const token = data.token || data[Object.keys(data)[0]];
      					pm.collectionVariables.set('jwt_token_2', token)
      				}
      			});
      		});
      	}
      });
    language: text/javascript
order: 21000
